name: Release (Windows)

# Builds ProtoProbe.exe, plcread.exe and the installer when a version tag (v0.3.1 ...) is pushed.
# "Run workflow" on the Actions tab does the same build without publishing, to try it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python packaging/build.py --version)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but APP_VERSION is $v"; exit 1; }
      - name: Build programs
        run: python packaging/build.py
      - name: Check the command line program starts
        run: |
          dist\plcread.exe --help
          dist\plcread.exe probe 127.0.0.1 --ports 5006 --timeout 0.3
        continue-on-error: false
      - name: Build installer
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          v=$(python packaging/build.py --version)
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$v" packaging/protoprobe.iss
      - name: Checksums
        shell: pwsh
        run: |
          cd dist
          Get-FileHash ProtoProbe.exe, plcread.exe, ProtoProbe-Setup-*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: protoprobe-windows
          path: |
            dist/ProtoProbe.exe
            dist/plcread.exe
            dist/ProtoProbe-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "ProtoProbe $GITHUB_REF_NAME" --generate-notes \
            dist/ProtoProbe-Setup-*.exe dist/ProtoProbe.exe dist/plcread.exe dist/SHA256SUMS.txt
